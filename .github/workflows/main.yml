name: Build ANGLE Android Multi-Arch APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual workflow triggers
  schedule:
  - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3 python3-pip curl snapd

    - name: Install Depot Tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
        echo "$HOME/depot_tools" >> $GITHUB_PATH

    - name: Bootstrap ANGLE Source
      run: |
        export PATH="$HOME/depot_tools:$PATH"
        mkdir angle-build && cd angle-build
        
        # Configure gclient to download Android dependencies
        gclient config --name=angle https://chromium.googlesource.com/angle/angle
        echo "target_os = ['android']" >> .gclient
        
        # Synchronize source code (shallow clone to save space and time)
        gclient sync --no-history

    - name: Install Android Build Dependencies
      run: |
        export PATH="$HOME/depot_tools:$PATH"
        cd angle-build/angle
        # Run the official Chromium script to install system packages
        sudo ./build/install-build-deps.sh --android

    - name: Generate Build Files (GN)
      run: |
        export PATH="$HOME/depot_tools:$PATH"
        cd angle-build/angle
        mkdir -p out/Android
        gn gen out/Android --args='
          target_os="android"
          target_cpu="arm64"
          enable_android_secondary_abi=true
          is_debug=false
          is_component_build=false
          symbol_level=0
          angle_assert_always_on=false
        '
        gn args --list out/Android

    - name: Build ANGLE APK
      run: |
        export PATH="$HOME/depot_tools:$PATH"
        cd angle-build/angle
        # Build the target APK package using Ninja via autoninja utility
        autoninja -C out/Android angle_apks
    - name: Return to repo
      run: cd ${{ github.workspace }}
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: prepare gradle
      run: chmod 777 ./gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload APK (lib) Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AngleLibraries-MultiArch
        path: angle-build/angle/out/Android/apks/AngleLibraries.apk
    - name: Upload APK (gui) Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AngleLibraries-Settings
        path: app/build/outputs/apk/debug/app-debug.apk
    - name: Release Angle apk
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file_glob: true
        file: |
          angle-build/angle/out/Android/apks/AngleLibraries.apk
          app/build/outputs/apk/debug/app-debug.apk
        tag: build
        overwrite: true
        body: "ANGLE APK Libraries (AngleLibraries.apk) and APK Settings (app-debug.apk) builds"
