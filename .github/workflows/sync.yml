name: Sync ANGLE Settings

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Clone AOSP Settings repository
        run: |
          git clone https://chromium.googlesource.com/angle/angle template
      - name: Clean up old assets and source files
        run: |
          rm -rf app/src/main/java/com/android/angle
          rm -rf app/src/main/res
          rm -rf app/src/main/assets
          rm -f app/src/main/AndroidManifest.xml
          rm -f build.gradle
          rm -f settings.gradle
          rm -rf gradle/
          rm -f app/build.gradle
      - name: Reorganize and Copy Files
        run: |
          mkdir -p app/src/main/java/com/android/angle
          mkdir -p app/src/main/res
          mkdir -p app/src/main/assets
          cp -r template/src/android_system_settings/src/com/android/angle/* app/src/main/java/com/android/angle/
          cp template/src/android_system_settings/src/com/android/angle/AndroidManifest.xml app/src/main/AndroidManifest.xml
          rm -f app/src/main/java/com/android/angle/AndroidManifest.xml
          cp -r template/src/android_system_settings/res/* app/src/main/res/
          cp -r template/src/android_system_settings/assets/* app/src/main/assets/
      - name: Generate Gradle Build Files
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AngleSettings"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          plugins {
              alias(libs.plugins.kotlin.android) apply false
              alias(libs.plugins.android.application) apply false
          }
          EOF
          mkdir -p gradle
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.4.0"
          compileSdk = "36"
          targetSdk = "36"
          minSdk = "35"
          kotlin = "1.9.24"
          appcompat = "1.7.0"
          layoutlib = "2024.1.1"
          preference = "1.2.1"
          core = "1.13.1"
          [libraries]
          android-layoutlib = { group = "com.android.tools.layoutlib", name = "layoutlib-api", version.ref = "layoutlib" }
          androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
          androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
          androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
          [plugins]
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          android-application = { id = "com.android.application", version.ref = "agp" }
          EOF
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat << 'EOF' > app/build.gradle
          plugins {
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.android.application)
          }

          android {
              namespace 'com.android.angle'
              compileSdk = 36

              defaultConfig {
                  applicationId "com.android.angle"
                  minSdk = 35
                  targetSdk = 36
                  versionCode 100
                  versionName "100"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  def requested = details.requested
                  if (requested.group == 'org.jetbrains.kotlin') {
                      if (requested.name == 'kotlin-stdlib-jdk7' || requested.name == 'kotlin-stdlib-jdk8') {
                          details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")
                      }
                  }
              }
          }
          gradle.projectsEvaluated {
              tasks.withType(JavaCompile).configureEach {
                  options.bootstrapClasspath = files(configurations.compileOnly.files) + options.bootstrapClasspath
              }
          }
          dependencies {
              compileOnly libs.android.layoutlib
              implementation libs.androidx.core
              implementation libs.androidx.appcompat
              implementation libs.androidx.preference
          }
          EOF
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Clean up source before push
        run: |
          rm -rf template
          rm -rf build
          rm -rf .gradle

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync ANGLE source code from AOSP"
            git push
          fi
